site_name: Aksara Framework
site_description: AI-Native Async Backend Framework for Python
site_url: https://aksara.dev
repo_url: https://github.com/aksara-framework/aksara
repo_name: aksara-framework/aksara

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your First 10 Minutes: getting-started/ten-minutes.md
      - Choosing a Pattern: getting-started/patterns.md
      - Project Layout: getting-started/project-layout.md
      - Settings: getting-started/settings.md
      - First App: getting-started/first-app.md
      - Database Setup: getting-started/database-setup.md
      - Running Your App: getting-started/running-your-app.md
  - ORM:
      - orm/index.md
      - Models: orm/models.md
      - Fields: orm/fields.md
      - Relations: orm/relations.md
      - Querying: orm/querying.md
      - Migrations: orm/migrations.md
      - Model Meta: orm/model-meta.md
  - API:
      - api/index.md
      - ViewSets: api/viewsets.md
      - Actions: api/actions.md
      - Serializers: api/serializers.md
      - Routing: api/routing.md
      - Permissions: api/permissions.md
      - Authentication: api/authentication.md
      - Throttling: api/throttling.md
  - Admin:
      - admin/index.md
      - Admin Site: admin/admin-site.md
      - ModelAdmin: admin/modeladmin.md
      - Customization: admin/customization.md
  - Middleware:
      - middleware/index.md
      - Overview: middleware/overview.md
      - Request ID: middleware/request-id.md
      - Tenant: middleware/tenant.md
      - Logging: middleware/logging.md
  - Debugging:
      - debugging/index.md
      - Error Pages: debugging/error-pages.md
      - AI Debug: debugging/ai-debug.md
      - Observability: debugging/observability.md
      - Diagnostics & Doctor: diagnostics.md
      - Gap Analysis: gapanalysis.md
      - Autoremediation: debugging/autoremediation.md
  - Inspectors:
      - inspectors/index.md
      - Query Inspector: inspectors/query.md
      - Model Inspector: inspectors/models.md
  - Search:
      - search/index.md
      - Semantic Engine: search/semantic.md
      - Studio Spotlight: search/studio.md
  - AI Mode:
      - ai-mode/index.md
      - Overview: ai-mode/overview.md
      - Tools: ai-mode/tools.md
      - Context Engine: ai-mode/context-engine.md
      - Query Engine: ai-mode/query-engine.md
      - CodeGen: ai-mode/codegen.md
      - Patch Engine: ai-mode/patch-engine.md
      - Planner: ai-mode/planner.md
      - Agent Runtime: ai-mode/agent-runtime.md
      - Schema Doctor: ai-mode/schema-doctor.md
      - Providers: ai-mode/providers.md
      - Route Hints: ai-mode/hints.md
      - Agent Mode: ai-mode/agent.md
      - Agent Workflows: ai-mode/workflows.md
      - AI Flows: ai-mode/flows.md
      - AI Connectors: ai-mode/connectors.md
      - Execution Runtime: ai-mode/runtime.md
      - Interactive Console: ai-mode/console.md
      - Project Graph: ai-mode/project-graph.md
      - AI Debugger: ai-mode/debugger.md
      - Best Practices: ai-mode/best-practices.md
  - Studio:
      - studio/index.md
