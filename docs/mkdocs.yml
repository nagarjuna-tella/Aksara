site_name: Aksara Framework
site_description: Async PostgreSQL framework with generated REST APIs and authorized MCP tools
site_url: https://nagarjuna-tella.github.io/Aksara/
repo_url: https://github.com/nagarjuna-tella/Aksara
repo_name: nagarjuna-tella/Aksara

theme:
  name: material
  logo: assets/aksara-logo.svg
  favicon: assets/aksara-logo.svg
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

