site_name: Aksara Framework
site_description: AI-Native Async Backend Framework for Python
site_url: https://aksara.dev
repo_url: https://github.com/aksara-framework/aksara
repo_name: aksara-framework/aksara

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your First 10 Minutes: getting-started/ten-minutes.md
      - Choosing a Pattern: getting-started/patterns.md
      - Project Layout: getting-started/project-layout.md
      - Settings: getting-started/settings.md
      - First App: getting-started/first-app.md
      - Database Setup: getting-started/database-setup.md
      - Running Your App: getting-started/running-your-app.md
  - ORM:
      - orm/index.md
      - Models: orm/models.md
      - Fields: orm/fields.md
      - Relations: orm/relations.md
      - Querying: orm/querying.md
      - Expressions & Transactions: orm/expressions-and-transactions.md
      - Bulk Operations: orm/bulk-operations.md
      - Soft Deletes: orm/soft-deletes.md
      - Signals: orm/signals.md
      - Fixtures: orm/fixtures.md
      - Migrations: orm/migrations.md
      - Model Meta: orm/model-meta.md
  - API:
