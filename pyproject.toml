[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aksara"
version = "0.5.41"
description = "⚡ Aksara - AI-native async backend framework for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nagarjuna Tella" }
]
keywords = ["async", "postgres", "orm", "fastapi", "asyncpg", "ai-native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",  # Required for form parsing (admin login)
    "bcrypt>=4.0.0",  # Required for auth & admin
    "jinja2>=3.0.0",  # Required for admin templates
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "uvicorn>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
aksara = "aksara.cli:main"

[project.urls]
Homepage = "https://github.com/aksara-framework/aksara"
Documentation = "https://github.com/aksara-framework/aksara/blob/main/docs/docs/getting-started/ten-minutes.md"
Changelog = "https://github.com/aksara-framework/aksara/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/aksara-framework/aksara/issues"
Source = "https://github.com/aksara-framework/aksara"

[tool.hatch.build.targets.wheel]
packages = ["aksara"]

[tool.hatch.build.targets.wheel.sources]
# Include static assets in the wheel
"aksara" = "aksara"

[tool.hatch.build.targets.sdist]
include = [
    "/aksara",
    "/aksara/studio/static/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
