[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aksara-framework"
version = "0.7.0rc1"
description = "Async PostgreSQL framework with generated REST APIs and authorized MCP tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nagarjuna Tella" }
]
keywords = ["async", "postgres", "orm", "fastapi", "asyncpg", "ai-native"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "asyncpg>=0.29.0",
    "aiosmtplib>=3.0.0",
    # Bounded by the minimum/latest pairs exercised in release-gate.yml.
    "fastapi>=0.136.1,<=0.141.1",
    "starlette>=1.0.1,<=1.6.0",
    "idna>=3.15",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",  # Required by Doctor security-matrix validation
    "click>=8.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.27",  # Required for form parsing (admin login)
    "bcrypt>=4.0.0",  # Required for auth & admin
    "jinja2>=3.0.0",  # Required for admin templates
    "httpx>=0.25.0",  # Required for direct AI provider API calls
    # Official maintained Model Context Protocol SDK. Keep the dependency inside
    # the minor line exercised by the v0.6 release gate.
    "mcp>=2.0.0,<2.1.0",
    "uvicorn>=0.24.0",  # Required for aksara dev / aksara run
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.100.0",
    "black>=24.0.0",
    # Pinned because static-analysis-baseline.json records version-specific counts.
    "ruff==0.16.6",
    "mypy==2.3.1",
    "pre-commit>=3.6.0",
]
s3 = [
    "aiobotocore>=2.13.0",
]

[project.scripts]
aksara = "aksara.cli:main"

[project.urls]
Homepage = "https://github.com/nagarjuna-tella/Aksara"
Documentation = "https://nagarjuna-tella.github.io/Aksara/"
Changelog = "https://github.com/nagarjuna-tella/Aksara/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/nagarjuna-tella/Aksara/issues"
Source = "https://github.com/nagarjuna-tella/Aksara"

[tool.hatch.build.targets.wheel]
packages = ["aksara"]

[tool.hatch.build.targets.wheel.sources]
# Include static assets in the wheel
"aksara" = "aksara"

[tool.hatch.build.targets.wheel.force-include]
# Bundle example projects so `aksara startproject --template <name>` works
# when Aksara is installed via pip (not just in repo dev mode).
"examples" = "aksara/_examples"

[tool.hatch.build.targets.sdist]
include = [
    "/aksara",
    "/aksara/studio/static/**/*",
    "/docs/docs",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "security: security hardening and regression tests",
    "fuzz: bounded adversarial or property-based fuzz tests",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "docs"]
# Existing MD5 uses are deterministic ID generation, not security hashing.
skips = ["B324"]
