[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidyut"
version = "0.4.9"
description = "⚡ Vidyut - Async Framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Nagarjuna Reddy Tella" }
]
keywords = ["async", "postgres", "orm", "fastapi", "asyncpg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Typing :: Typed",
]

dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.104.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",  # Required for form parsing (admin login)
    "bcrypt>=4.0.0",  # Required for auth & admin
    "jinja2>=3.0.0",  # Required for admin templates
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "uvicorn>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
vidyut = "vidyut.cli:main"

[project.urls]
Homepage = "https://github.com/vidyut-orm/vidyut"
Documentation = "https://github.com/vidyut-orm/vidyut#readme"

[tool.hatch.build.targets.wheel]
packages = ["vidyut"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
