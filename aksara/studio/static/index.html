<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aksara Studio - Admin Dashboard for Aksara Framework">
    <title>Aksara Studio</title>
    <link rel="stylesheet" href="/studio/assets/styles.css">
    <link rel="icon" href="/studio/assets/icons/aksara-logo.svg" type="image/svg+xml">
</head>
<body>
    <div id="root">
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="/studio/assets/icons/aksara-logo.svg" alt="Aksara" width="32" height="32">
                    <span class="logo-text">Aksara Studio</span>
                </div>
                <span class="version-badge" id="version-badge">v0.0.0</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#/overview" class="nav-item active" data-section="overview">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Overview</span>
                </a>
                <a href="#/models" class="nav-item" data-section="models">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                    <span>Models & Schema</span>
                </a>
                <a href="#/routes" class="nav-item" data-section="routes">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16.5 9.4l-9-5.19"></path>
                        <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"></path>
                        <path d="M3.27 6.96L12 12.01l8.73-5.05"></path>
                        <path d="M12 22.08V12"></path>
                    </svg>
                    <span>Routes Explorer</span>
                </a>
                <a href="#/migrations" class="nav-item" data-section="migrations">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"></path>
                    </svg>
                    <span>Migrations</span>
                </a>
                <a href="#/diagnostics" class="nav-item" data-section="diagnostics">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                    </svg>
                    <span>Diagnostics</span>
                </a>
                <a href="#/db-queries" class="nav-item" data-section="db-queries">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                    </svg>
                    <span>DB & Queries</span>
                </a>
                <a href="#/api" class="nav-item" data-section="api">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 016.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"></path>
                    </svg>
                    <span>API Explorer</span>
                </a>
                <a href="#/ai-helpers" class="nav-item" data-section="ai-helpers">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                        <path d="M19 12a7 7 0 11-14 0 7 7 0 0114 0z" stroke-dasharray="2 2"></path>
                    </svg>
                    <span>AI Helpers</span>
                </a>
                <a href="#/ai-profiles" class="nav-item" data-section="ai-profiles">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a4 4 0 00-4 4v2a4 4 0 008 0V6a4 4 0 00-4-4z"></path>
                        <path d="M6 21v-2a4 4 0 014-4h4a4 4 0 014 4v2"></path>
                        <circle cx="19" cy="5" r="2"></circle>
                        <path d="M19 7v4"></path>
                    </svg>
                    <span>AI Profiles</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
                    </svg>
                </button>
                <div class="connection-status" id="connection-status">
                    <span class="status-dot"></span>
                    <span class="status-text">Connecting...</span>
                </div>
            </div>
        </aside>
        
        <main id="content">
            <div class="loading-state" id="loading-state">
                <div class="spinner"></div>
                <p>Loading Aksara Studio...</p>
            </div>
            
            <div class="error-state hidden" id="error-state">
                <div class="error-icon">⚠️</div>
                <h2>Connection Error</h2>
                <p id="error-message">Unable to connect to Aksara backend.</p>
                <button id="retry-button" class="btn btn-primary">Retry</button>
            </div>
            
            <div class="content-area hidden" id="content-area"></div>
        </main>
    </div>
    
    <!-- Templates for each section -->
    <template id="template-overview">
        <div class="section-header">
            <h1>System Overview</h1>
            <p class="section-subtitle">Runtime status and system information</p>
        </div>
        
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Aksara Version</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="aksara-version">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Python Version</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="python-version">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Uptime</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="uptime">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Environment</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="environment">-</span>
                        <span class="status" id="debug-badge">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="cards-grid">
            <div class="card card-wide">
                <div class="card-header">
                    <h3>Database Status</h3>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <span>Connection</span>
                        <span class="status" id="db-status">-</span>
                    </div>
                    <div class="status-row">
                        <span>Pool Size</span>
                        <span id="db-pool-size">-</span>
                    </div>
                    <div class="status-row">
                        <span>Available</span>
                        <span id="db-pool-available">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card card-wide">
                <div class="card-header">
                    <h3>Migration Status</h3>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <span>Total</span>
                        <span id="migrations-total">-</span>
                    </div>
                    <div class="status-row">
                        <span>Applied</span>
                        <span id="migrations-applied">-</span>
                    </div>
                    <div class="status-row">
                        <span>Pending</span>
                        <span class="status" id="migrations-pending">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Quick Stats</h3>
            </div>
            <div class="card-body">
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-value" id="model-count">-</span>
                        <span class="stat-label">Models</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="route-count">-</span>
                        <span class="stat-label">Routes</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="viewset-count">-</span>
                        <span class="stat-label">ViewSets</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="ai-tool-count">-</span>
                        <span class="stat-label">AI Tools</span>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <template id="template-models">
        <div class="section-header">
            <h1>Models & Schema</h1>
            <p class="section-subtitle">Database models and their relationships</p>
        </div>
        
        <div class="toolbar">
            <input type="search" id="models-search" class="search-input" placeholder="Search models...">
        </div>
        
        <div class="models-list" id="models-list">
            <div class="empty-state">
                <p>No models found</p>
            </div>
        </div>
    </template>
    
    <template id="template-routes">
        <div class="section-header">
            <h1>Routes Explorer</h1>
            <p class="section-subtitle">All registered API endpoints</p>
        </div>
        
        <div class="toolbar">
            <input type="search" id="routes-search" class="search-input" placeholder="Search routes...">
            <div class="filter-group">
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-studio" checked> Studio
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-admin" checked> Admin
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-ai" checked> AI
                </label>
                <label class="filter-checkbox">
                    <input type="checkbox" id="filter-api" checked> API
                </label>
            </div>
        </div>
        
        <div class="routes-table-wrapper">
            <table class="routes-table">
                <thead>
                    <tr>
                        <th>Method</th>
                        <th>Path</th>
                        <th>Name</th>
                        <th>Type</th>
                    </tr>
                </thead>
                <tbody id="routes-tbody">
                </tbody>
            </table>
        </div>
    </template>
    
    <template id="template-migrations">
        <div class="section-header">
            <h1>Migrations</h1>
            <p class="section-subtitle">Database migration status and history</p>
        </div>
        
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Summary</h3>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <span>Total Migrations</span>
                        <span id="mig-total">-</span>
                    </div>
                    <div class="status-row">
                        <span>Applied</span>
                        <span id="mig-applied">-</span>
                    </div>
                    <div class="status-row">
                        <span>Pending</span>
                        <span class="status" id="mig-pending">-</span>
                    </div>
                    <div class="status-row">
                        <span>Conflicts</span>
                        <span class="status" id="mig-conflicts">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card card-wide">
                <div class="card-header">
                    <h3>Last Applied</h3>
                </div>
                <div class="card-body">
                    <code id="mig-last-applied">-</code>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Apps</h3>
            </div>
            <div class="card-body">
                <div class="apps-list" id="mig-apps-list">
                    <div class="empty-state">
                        <p>No apps configured</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card" id="conflicts-card" style="display: none;">
            <div class="card-header">
                <h3>⚠️ Migration Conflicts</h3>
            </div>
            <div class="card-body">
                <div class="conflicts-list" id="mig-conflicts-list"></div>
            </div>
        </div>
    </template>
    
    <template id="template-diagnostics">
        <div class="section-header">
            <h1>Diagnostics</h1>
            <p class="section-subtitle">Live runtime diagnostics and health monitoring</p>
        </div>
        
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Process Info</h3>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <span>PID</span>
                        <code id="diag-pid">-</code>
                    </div>
                    <div class="status-row">
                        <span>Start Time</span>
                        <span id="diag-start-time">-</span>
                    </div>
                    <div class="status-row">
                        <span>Uptime</span>
                        <span id="diag-uptime">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Database</h3>
                </div>
                <div class="card-body">
                    <div class="status-row">
                        <span>Status</span>
                        <span class="status" id="diag-db-status">-</span>
                    </div>
                    <div class="status-row">
                        <span>Pending Migrations</span>
                        <span id="diag-pending-mig">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Studio Configuration</h3>
            </div>
            <div class="card-body">
                <div class="status-row">
                    <span>Enabled</span>
                    <span class="status" id="diag-studio-enabled">-</span>
                </div>
                <div class="status-row">
                    <span>Base Path</span>
                    <code id="diag-studio-path">-</code>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Installed Apps</h3>
            </div>
            <div class="card-body">
                <div class="apps-badges" id="diag-apps-list">
                    <span class="empty-state">No apps</span>
                </div>
            </div>
        </div>
        
        <div class="refresh-info">
            <span>Auto-refresh every 5 seconds</span>
            <button id="refresh-diagnostics" class="btn btn-sm">Refresh Now</button>
        </div>
    </template>
    
    <template id="template-api">
        <div class="section-header">
            <h1>API Explorer</h1>
            <p class="section-subtitle">Browse available API endpoints</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Studio Endpoints</h3>
            </div>
            <div class="card-body">
                <div class="endpoint-list">
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/handshake</code>
                        <span class="endpoint-desc">Complete project handshake</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/context/summary</code>
                        <span class="endpoint-desc">Lightweight context summary</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/health</code>
                        <span class="endpoint-desc">Health check with database status</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/migrations/summary</code>
                        <span class="endpoint-desc">Migration statistics per app</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/runtime/info</code>
                        <span class="endpoint-desc">Runtime diagnostics</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/runtime/routes</code>
                        <span class="endpoint-desc">All registered routes</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/ai/context</code>
                        <span class="endpoint-desc">AI context export</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/ai/schemas</code>
                        <span class="endpoint-desc">AI operation schemas</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/studio/ai/prompts</code>
                        <span class="endpoint-desc">Prompt templates</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>AI Endpoints</h3>
            </div>
            <div class="card-body">
                <div class="endpoint-list">
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/ai/context/full</code>
                        <span class="endpoint-desc">Full schema context for AI</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/ai/tools</code>
                        <span class="endpoint-desc">Available AI tools</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/ai/tools/mcp</code>
                        <span class="endpoint-desc">MCP-formatted tools</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Documentation</h3>
            </div>
            <div class="card-body">
                <div class="endpoint-list">
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/docs</code>
                        <span class="endpoint-desc">OpenAPI (Swagger) documentation</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/redoc</code>
                        <span class="endpoint-desc">ReDoc documentation</span>
                    </div>
                    <div class="endpoint-item">
                        <span class="method-badge get">GET</span>
                        <code>/openapi.json</code>
                        <span class="endpoint-desc">OpenAPI schema (JSON)</span>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- v0.5.4: AI Helpers Template -->
    <template id="template-ai-helpers">
        <div class="section-header">
            <h1>AI Helpers</h1>
            <p class="section-subtitle">Export context and schemas for external AI tools</p>
        </div>
        
        <div class="info-banner">
            <span class="info-icon">ℹ️</span>
            <p>Aksara is LLM-agnostic. These tools help you use AI assistants like ChatGPT, Claude, or Copilot with your Aksara app. No AI providers are bundled or called.</p>
        </div>
        
        <!-- AI Context Export Panel -->
        <div class="card">
            <div class="card-header">
                <h3>AI Context Export</h3>
                <button class="btn btn-sm btn-secondary" id="refresh-ai-context">Refresh</button>
            </div>
            <div class="card-body">
                <p class="card-description">A JSON bundle containing your project's models, routes, and available tools. Copy this to share with AI assistants.</p>
                <div class="json-container">
                    <div class="json-header">
                        <span class="json-label">Context JSON</span>
                        <button class="btn btn-sm btn-copy" id="copy-ai-context" data-target="ai-context-json">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <pre id="ai-context-json" class="json-pre"><code>Loading...</code></pre>
                </div>
            </div>
        </div>
        
        <!-- AI Schemas Panel -->
        <div class="card">
            <div class="card-header">
                <h3>AI Operation Schemas</h3>
                <button class="btn btn-sm btn-secondary" id="refresh-ai-schemas">Refresh</button>
            </div>
            <div class="card-body">
                <p class="card-description">JSON Schemas that AI agents can use to generate valid requests for planning, patching, querying, and code generation.</p>
                
                <div class="schema-tabs">
                    <button class="schema-tab active" data-schema="plan">Plan Schema</button>
                    <button class="schema-tab" data-schema="patch">Patch Schema</button>
                    <button class="schema-tab" data-schema="query">Query Schema</button>
                    <button class="schema-tab" data-schema="codegen">Codegen Schema</button>
                </div>
                
                <div class="json-container">
                    <div class="json-header">
                        <span class="json-label" id="schema-label">Plan Schema</span>
                        <button class="btn btn-sm btn-copy" id="copy-ai-schema">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <pre id="ai-schema-json" class="json-pre"><code>Loading...</code></pre>
                </div>
            </div>
        </div>
        
        <!-- Prompt Templates Panel -->
        <div class="card">
            <div class="card-header">
                <h3>Prompt Templates</h3>
                <button class="btn btn-sm btn-secondary" id="refresh-ai-prompts">Refresh</button>
            </div>
            <div class="card-body">
                <p class="card-description">Pre-built prompts with placeholders. Copy a template and paste it into your AI assistant.</p>
                <div id="prompt-templates-list" class="prompt-templates-list">
                    <div class="prompt-loading">Loading prompts...</div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- v0.5.10: DB & Queries Template -->
    <template id="template-db-queries">
        <div class="section-header">
            <h1>DB & Queries</h1>
            <p class="section-subtitle">Database query inspector and performance profiler</p>
        </div>
        
        <div id="tracing-disabled-banner" class="info-banner warning hidden">
            <span class="info-icon">⚠️</span>
            <p>Query tracing is disabled. Enable it by setting <code>db_trace_enabled=True</code> in your settings or <code>AKSARA_DB_TRACE_ENABLED=true</code> environment variable.</p>
        </div>
        
        <!-- Stats Cards -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Total Queries</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="db-total-queries">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Avg Per Request</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="db-avg-queries">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Slow Queries</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value status-warning" id="db-slow-queries">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>N+1 Detected</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value status-danger" id="db-n1-count">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Slow Queries Panel -->
        <div class="card">
            <div class="card-header">
                <h3>Slowest Queries</h3>
                <span class="badge" id="slow-threshold-badge">Threshold: -ms</span>
            </div>
            <div class="card-body">
                <div class="queries-list" id="slow-queries-list">
                    <div class="empty-state">
                        <p>No slow queries recorded</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Recent Requests Panel -->
        <div class="card">
            <div class="card-header">
                <h3>Recent Requests</h3>
                <button class="btn btn-sm btn-secondary" id="refresh-db-queries">Refresh</button>
            </div>
            <div class="card-body">
                <div class="requests-list" id="recent-requests-list">
                    <div class="empty-state">
                        <p>No requests recorded yet</p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- v0.5.11: AI Profiles Template -->
    <!-- v0.5.12: Added health badge and issues list -->
    <template id="template-ai-profiles">
        <div class="section-header">
            <h1>AI Profiles</h1>
            <p class="section-subtitle">AI provider configurations and model profiles</p>
        </div>
        
        <!-- v0.5.12: Health Status Banner -->
        <div id="ai-health-banner" class="ai-health-banner hidden">
            <div class="ai-health-status">
                <span class="ai-health-badge" id="ai-health-badge">Loading...</span>
                <span class="ai-health-summary" id="ai-health-summary"></span>
            </div>
            <div class="ai-health-issues" id="ai-health-issues"></div>
        </div>
        
        <div id="ai-profiles-disabled-banner" class="info-banner warning hidden">
            <span class="info-icon">⚠️</span>
            <p>AI profiles are disabled. Enable them by setting <code>ai_profiles_enabled=True</code> in your settings.</p>
        </div>
        
        <!-- Stats Cards -->
        <div class="cards-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Providers</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="ai-provider-count">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Total Models</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="ai-model-count">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Default Provider</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="ai-default-provider">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h3>Environment</h3>
                </div>
                <div class="card-body">
                    <div class="metric">
                        <span class="metric-value" id="ai-environment">-</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Providers Panel -->
        <div class="card">
            <div class="card-header">
                <h3>AI Providers</h3>
                <button class="btn btn-sm btn-secondary" id="refresh-ai-profiles">Refresh</button>
            </div>
            <div class="card-body">
                <div class="providers-list" id="ai-providers-list">
                    <div class="empty-state">
                        <p>No AI providers configured</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Secrets Panel -->
        <div class="card">
            <div class="card-header">
                <h3>Required Secrets</h3>
                <span class="badge" id="secrets-count-badge">-</span>
            </div>
            <div class="card-body">
                <p class="card-description">Environment variables needed for AI providers. Values are never shown, only configuration status.</p>
                <div class="secrets-list" id="ai-secrets-list">
                    <div class="empty-state">
                        <p>No secrets required</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Export Panel -->
        <div class="card">
            <div class="card-header">
                <h3>Export Profile Set</h3>
            </div>
            <div class="card-body">
                <p class="card-description">Export the full AI profile configuration as JSON for external tools and agents.</p>
                <div class="json-container">
                    <div class="json-header">
                        <span class="json-label">Profile Set JSON</span>
                        <button class="btn btn-sm btn-copy" id="copy-ai-profiles" data-target="ai-profiles-json">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                            </svg>
                            Copy
                        </button>
                    </div>
                    <pre id="ai-profiles-json" class="json-pre"><code>Loading...</code></pre>
                </div>
            </div>
        </div>
        
        <!-- v0.5.13: AI Hints Panel -->
        <div class="card">
            <div class="card-header">
                <h3>AI Route Hints</h3>
                <span class="badge" id="ai-hints-count">-</span>
            </div>
            <div class="card-body">
                <p class="card-description">Per-route AI metadata for LLM guidance. Click a hint to expand details.</p>
                <div class="ai-hints-filter-container">
                    <input type="text" id="ai-hints-filter" placeholder="Filter by title, path, or view..." class="filter-input">
                </div>
                <div class="ai-hints-list" id="ai-hints-list">
                    <div class="empty-state">
                        <p>No AI hints defined yet</p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <script src="/studio/assets/app.js" defer></script>
</body>
</html>
