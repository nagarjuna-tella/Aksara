<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ site_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4DA8FF;
            --primary-dark: #1E90FF;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --bg: #0f0f23;
            --bg-light: #1a1a2e;
            --bg-card: #16213e;
            --text: #ffffff;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }
        
        /* Header */
        .login-header {
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
        
        /* Main container */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .login-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .login-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        /* Alert messages */
        .alert {
            padding: 0.875rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        
        .alert-error {
            background: var(--danger-bg);
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        
        .alert-success {
            background: var(--success-bg);
            border: 1px solid var(--success);
            color: #86efac;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-light);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .form-input::placeholder {
            color: var(--text-muted);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }
        
        /* Button */
        .btn-submit {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: var(--accent);
            color: #0f0f23;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.5rem;
        }
        
        .btn-submit:hover {
            background: var(--accent-hover);
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }
        
        /* Footer hint */
        .login-footer {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        
        .login-footer p {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .login-footer code {
            display: inline-block;
            background: var(--bg);
            color: var(--accent);
            padding: 0.375rem 0.75rem;
            border-radius: 6px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
        }
        
        /* Powered by */
        .powered-by {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        
        .powered-by a {
            color: var(--accent);
            text-decoration: none;
        }
        
        .powered-by a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="login-header">
        <div class="header-brand">
            <span>⚡</span>
            <span>{{ site_name }}</span>
        </div>
    </header>
    
    <main class="login-container">
        <div class="login-card">
            <div class="login-title">
                <h1>⚡ {{ site_name }}</h1>
            </div>
            <p class="login-subtitle">Sign in to access the admin panel</p>
            
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}
            
            {% if message %}
            <div class="alert alert-success">
                {{ message }}
            </div>
            {% endif %}
            
            <form method="POST" action="{{ request.url_for('admin:login') }}">
                <div class="form-group">
                    <label for="username" class="form-label">Email Address</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        autocomplete="username"
                        class="form-input"
                        placeholder="admin@example.com"
                        value="{{ username or '' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        autocomplete="current-password"
                        class="form-input"
                        placeholder="Enter your password"
                    >
                </div>
                
                <input type="hidden" name="next" value="{{ next or '/admin/' }}">
                
                <button type="submit" class="btn-submit">
                    Sign In
                </button>
            </form>
            
            <div class="login-footer">
                <p>Don't have an account?</p>
                <code>vidyut createsuperuser</code>
            </div>
        </div>
    </main>
    
    <footer class="powered-by">
        Built with <a href="https://github.com/nagarjuna-tella/vidyut" target="_blank">⚡ Vidyut</a>
    </footer>
</body>
</html>
