<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ site_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* Shadcn-inspired color palette */
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --primary-foreground: #FFFFFF;
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.08);
            
            /* Light mode colors (zinc scale) */
            --background: #FAFAFA;
            --foreground: #09090B;
            --card: #FFFFFF;
            --card-foreground: #09090B;
            --muted: #F4F4F5;
            --muted-foreground: #71717A;
            --border: #E4E4E7;
            --border-dark: #D4D4D8;
            --input: #FFFFFF;
            --ring: #6366F1;
            --ring-alpha: rgba(99, 102, 241, 0.2);
            
            /* Typography */
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Radius */
            --radius: 0.5rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.75rem;
        }
        
        [data-theme="dark"] {
            --background: #09090B;
            --foreground: #FAFAFA;
            --card: #18181B;
            --card-foreground: #FAFAFA;
            --muted: #27272A;
            --muted-foreground: #A1A1AA;
            --border: #27272A;
            --border-dark: #3F3F46;
            --input: #18181B;
            --ring-alpha: rgba(99, 102, 241, 0.3);
            
            --danger-bg: rgba(239, 68, 68, 0.12);
            --success-bg: rgba(16, 185, 129, 0.12);
        }
        
        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Header */
        .login-header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0.875rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: var(--foreground);
            letter-spacing: -0.02em;
        }
        
        .header-brand svg {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }
        
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--card);
            color: var(--muted-foreground);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .theme-toggle:hover {
            background: var(--muted);
            color: var(--foreground);
            border-color: var(--border-dark);
        }
        
        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }
        
        .theme-icon-dark { display: none; }
        [data-theme="dark"] .theme-icon-light { display: none; }
        [data-theme="dark"] .theme-icon-dark { display: block; }
        
        /* Main container */
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
        }
        
        .login-title {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        
        .login-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--foreground);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: -0.025em;
        }
        
        .login-title h1 svg {
            width: 28px;
            height: 28px;
            color: var(--primary);
        }
        
        .login-subtitle {
            text-align: center;
            color: var(--muted-foreground);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        /* Alert messages */
        .alert {
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert-error {
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #DC2626;
        }
        
        [data-theme="dark"] .alert-error {
            color: #F87171;
        }
        
        .alert-success {
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #059669;
        }
        
        [data-theme="dark"] .alert-success {
            color: #34D399;
        }
        
        /* Form */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--foreground);
            margin-bottom: 0.375rem;
        }
        
        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 0.75rem;
            background: var(--input);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--foreground);
            font-size: 0.875rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        
        .form-input::placeholder {
            color: var(--muted-foreground);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--ring);
            box-shadow: 0 0 0 2px var(--ring-alpha);
        }
        
        /* Button */
        .btn-submit {
            width: 100%;
            height: 40px;
            padding: 0 1.5rem;
            background: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: var(--radius);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            margin-top: 0.25rem;
        }
        
        .btn-submit:hover {
            background: var(--primary-hover);
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }
        
        /* Footer hint */
        .login-footer {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            text-align: center;
        }
        
        .login-footer p {
            color: var(--muted-foreground);
            font-size: 0.8125rem;
            margin-bottom: 0.5rem;
        }
        
        .login-footer code {
            display: inline-block;
            background: var(--muted);
            color: var(--primary);
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }
        
        /* Powered by */
        .powered-by {
            text-align: center;
            padding: 1.25rem;
            color: var(--muted-foreground);
            font-size: 0.75rem;
        }
        
        .powered-by a {
            color: var(--primary);
            text-decoration: none;
        }
        
        .powered-by a:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        // Theme toggle
        (function() {
            const savedTheme = localStorage.getItem('aksara-admin-theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <header class="login-header">
        <div class="header-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span>{{ site_name }}</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
            <svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
            <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>
    
    <main class="login-container">
        <div class="login-card">
            <div class="login-title">
                <h1>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    {{ site_name }}
                </h1>
            </div>
            <p class="login-subtitle">Sign in to access the admin panel</p>
            
            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}
            
            {% if message %}
            <div class="alert alert-success">
                {{ message }}
            </div>
            {% endif %}
            
            <form method="POST" action="{{ request.url_for('admin:login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label for="username" class="form-label">Email Address</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        autocomplete="username"
                        class="form-input"
                        placeholder="admin@example.com"
                        value="{{ username or '' }}"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        autocomplete="current-password"
                        class="form-input"
                        placeholder="Enter your password"
                    >
                </div>
                
                <input type="hidden" name="next" value="{{ next or '/admin/' }}">
                
                <button type="submit" class="btn-submit">
                    Sign In
                </button>
            </form>
            
            <div class="login-footer">
                <p>Don't have an account?</p>
                <code>aksara createsuperuser</code>
            </div>
        </div>
    </main>
    
    <footer class="powered-by">
        Built with <a href="https://github.com/nagarjuna-tella/Aksara" target="_blank">Aksara</a>
    </footer>
    
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme') || 'light';
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('aksara-admin-theme', next);
        }
    </script>
</body>
</html>
