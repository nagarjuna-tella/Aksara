name: Bug Report
description: Report a problem with Aksara
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please do **not** use
        this form for security issues — follow [SECURITY.md](https://github.com/nagarjuna-tella/Aksara/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps or code that trigger the problem.
      placeholder: |
        1. Define a model with ...
        2. Run `aksara ...`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include the full traceback if there is one.
    validations:
      required: true
  - type: input
    id: aksara-version
    attributes:
      label: Aksara Version
      description: Output of `aksara --version`.
      placeholder: "0.5.51"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.11"
    validations:
      required: true
  - type: input
    id: postgres-version
    attributes:
      label: PostgreSQL Version
      placeholder: "15"
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15 / Ubuntu 24.04"
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics
      description: If applicable, paste the output of `aksara doctor launch-check --format json`.
      render: json
    validations:
      required: false
