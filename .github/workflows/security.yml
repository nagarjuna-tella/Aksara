name: Security CI

on:
  pull_request:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  AKSARA_REQUIRE_SECURITY_MATRIX: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc auto .

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run Bandit
        run: bandit -r aksara -x tests,.venv,docs --severity-level high --skip B324

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.28.0 \
            detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: ignore

  security-tests:
    name: Security and diagnostics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run security tests
        run: python -m pytest tests/security/ -q

      - name: Run fuzz tests explicitly
        run: python -m pytest tests/security/fuzz/ -q

      - name: Run diagnostics tests
        run: python -m pytest tests/diagnostics/ -q

  docs-security-check:
    name: Security docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-autorefs mike "pymdown-extensions>=10.21.3"

      - name: Ensure public security docs do not expose internal round language
        run: |
          if grep -RniE "Round [1-5]|this round|future round|later round|hardening round" SECURITY.md docs/docs/security security/README.md; then
            echo "::error::Public security docs contain internal hardening-round language."
            exit 1
          fi

      - name: Build docs strictly
        run: mkdocs build --strict -f docs/mkdocs.yml
