name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  AKSARA_REQUIRE_SECURITY_MATRIX: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  full-tests:
    name: Full test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        web: [minimum, latest-supported]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aksara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aksara_test
      AKSARA_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install supported web boundary
        env:
          WEB_BOUNDARY: ${{ matrix.web }}
        run: |
          if [ "$WEB_BOUNDARY" = minimum ]; then
            python -m pip install 'fastapi==0.136.1' 'starlette==1.0.1'
          else
            python -m pip install 'fastapi==0.141.1' 'starlette==1.6.0'
          fi
          python -m pip freeze

      - name: Run full suite
        run: python -m pytest --tb=short -q

  security-tests:
    name: Security, fuzz, and diagnostics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run security tests
        run: python -m pytest tests/security/ -q

      - name: Run fuzz tests explicitly
        run: python -m pytest tests/security/fuzz/ -q

      - name: Run diagnostics tests
        run: python -m pytest tests/diagnostics/ -q

  diagnostics-production-check:
    name: Production diagnostics
    runs-on: ubuntu-latest
    env:
      AKSARA_ENV: production
      AKSARA_DEBUG: "false"
      AKSARA_SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      AKSARA_SECURITY_MATRIX_PATH: security/security_matrix.release.yml
      AKSARA_MCP_ENABLED: "false"
      AKSARA_STUDIO_EXPOSE_IN_PRODUCTION: "false"
      AKSARA_STUDIO_REQUIRE_AUTH: "true"
      AKSARA_COOKIE_SECURE: "true"
      AKSARA_ADMIN_RATE_LIMIT_ENABLED: "true"
      CORS_ALLOW_ALL_ORIGINS: "false"
      CORS_ALLOW_CREDENTIALS: "false"
      AKSARA_AI_CONSOLE_ENABLED: "false"
      AKSARA_AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run production-check
        run: aksara doctor production-check --release --format json

  package-build:
    name: Package build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build 'twine>=7,<8'

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Verify wheel import
        run: |
          python -m venv /tmp/aksara-wheel-test
          /tmp/aksara-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/aksara-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/aksara-wheel-test/bin/python -c "import aksara; print(getattr(aksara, '__version__', 'aksara import ok'))"

  production-reference-app:
    name: Packaged production reference app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aksara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aksara_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel and install gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          python -m build --wheel

      - name: Run production reference app gate
        run: python scripts/run_support_desk_gate.py --wheel dist/*.whl

      - name: Upload production reference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: support-desk-production-gate
          path: audit-evidence/v070/support-desk-gate.json
          if-no-files-found: error

  installed-package-truth:
    name: Installed-wheel documentation journey
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aksara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aksara_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build candidate wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          python -m build --wheel

      - name: Run installed-package journey
        run: >-
          python scripts/run_installed_package_gate.py
          --wheel dist/*.whl
          --candidate-sha "${GITHUB_SHA}"

      - name: Upload installed-package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v070-installed-package-gate
          path: audit-evidence/v070/installed-package-gate.json
          if-no-files-found: error

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --desc auto .

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install static-analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit

      - name: Enforce reviewed Ruff and mypy baseline
        run: python scripts/check_static_baseline.py

      - name: Run Bandit
        run: bandit -r aksara -x tests,.venv,docs --severity-level high --skip B324

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            --workdir /repo \
            zricethezav/gitleaks:v8.28.0 \
            detect --no-git --redact -v --exit-code=2 --report-format=sarif --report-path=results.sarif

      - name: Upload Gitleaks SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: results.sarif
          if-no-files-found: ignore

  sbom:
    name: SBOM generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and SBOM tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json

  docs-build:
    name: Docs strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-autorefs mike "pymdown-extensions>=10.21.3"

      - name: Ensure public security docs do not expose internal round language
        run: |
          if grep -RniE "Round [1-5]|this round|future round|later round|hardening round" SECURITY.md docs/docs/security security/README.md; then
            echo "::error::Public security docs contain internal hardening-round language."
            exit 1
          fi

      - name: Build docs strictly
        run: mkdocs build --strict -f docs/mkdocs.yml
