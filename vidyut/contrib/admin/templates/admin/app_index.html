{% extends "admin/base.html" %}

{% block title %}{{ app_label }} - {{ site_name }}{% endblock %}

{% block breadcrumb %}
<div class="breadcrumb">
    <a href="{{ request.url_for('admin:index') }}">Home</a>
    <span>›</span>
    <span>{{ app_label }}</span>
</div>
{% endblock %}

{% block content %}
<h1>{{ app_label }}</h1>

<div class="card">
    <ul class="model-list">
        {% for model in models %}
        <li>
            <a href="{{ request.url_for('admin:model_list', app_label=app_label, model_name=model.__name__|lower) }}">
                {{ model.__name__ }}
            </a>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
