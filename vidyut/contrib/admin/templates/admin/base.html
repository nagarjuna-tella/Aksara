<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4DA8FF;
            --primary-dark: #1E90FF;
            --danger: #dc3545;
            --success: #28a745;
            --bg: #0f0f23;
            --bg-light: #1a1a2e;
            --bg-card: #16213e;
            --text: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        a {
            color: var(--primary);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        /* Header */
        .admin-header {
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .admin-title a {
            color: var(--text);
        }
        
        .admin-title .logo {
            width: 28px;
            height: 28px;
        }
        
        .admin-user {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* Breadcrumb */
        .breadcrumb {
            padding: 1rem 2rem;
            background: var(--bg-light);
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .breadcrumb a {
            color: var(--text-muted);
        }
        
        .breadcrumb a:hover {
            color: var(--primary);
        }
        
        .breadcrumb span {
            margin: 0 0.5rem;
        }
        
        /* Main Content */
        .admin-main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--bg-light);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        
        tr:hover {
            background: rgba(77, 168, 255, 0.05);
        }
        
        /* Buttons - Neumorphic style */
        .btn {
            display: inline-block;
            padding: 0.625rem 1.5rem;
            min-width: 8em;
            height: 2.75em;
            border-radius: 30em;
            font-weight: 500;
            font-size: 0.875rem;
            font-family: inherit;
            text-decoration: none;
            text-align: center;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            z-index: 1;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3),
                        -4px -4px 8px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .btn::before {
            content: '';
            width: 0;
            height: 100%;
            border-radius: 30em;
            position: absolute;
            top: 0;
            left: 0;
            transition: 0.5s ease;
            display: block;
            z-index: -1;
        }
        
        .btn:hover::before {
            width: 100%;
        }
        
        .btn:hover {
            text-decoration: none;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3),
                        -2px -2px 4px rgba(255, 255, 255, 0.05);
        }
        
        .btn-primary {
            background: var(--bg-card);
            color: white;
        }
        
        .btn-primary::before {
            background-image: linear-gradient(to right, var(--primary) 0%, #6dd5fa 100%);
        }
        
        .btn-primary:hover {
            color: white;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4),
                        -4px -4px 12px rgba(77, 168, 255, 0.1);
        }
        
        .btn-secondary {
            background: var(--bg-light);
            color: var(--text);
        }
        
        .btn-secondary::before {
            background-image: linear-gradient(to right, var(--bg-card) 0%, #2a2a4e 100%);
        }
        
        .btn-secondary:hover {
            color: var(--text);
        }
        
        .btn-danger {
            background: var(--bg-card);
            color: white;
        }
        
        .btn-danger::before {
            background-image: linear-gradient(to right, #dc3545 0%, #ff6b6b 100%);
        }
        
        .btn-danger:hover {
            color: white;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4),
                        -4px -4px 12px rgba(220, 53, 69, 0.1);
        }
        
        .btn-success {
            background: var(--bg-card);
            color: white;
        }
        
        .btn-success::before {
            background-image: linear-gradient(to right, #0fd850 0%, #f9f047 100%);
        }
        
        .btn-success:hover {
            color: #111;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4),
                        -4px -4px 12px rgba(15, 216, 80, 0.1);
        }
        
        /* 3D Cube Spinner */
        .spinner {
            width: 44px;
            height: 44px;
            animation: spinner-y0fdc1 2s infinite ease;
            transform-style: preserve-3d;
        }
        
        .spinner > div {
            background-color: rgba(77, 168, 255, 0.2);
            height: 100%;
            position: absolute;
            width: 100%;
            border: 2px solid var(--primary);
        }
        
        .spinner div:nth-of-type(1) {
            transform: translateZ(-22px) rotateY(180deg);
        }
        
        .spinner div:nth-of-type(2) {
            transform: rotateY(-270deg) translateX(50%);
            transform-origin: top right;
        }
        
        .spinner div:nth-of-type(3) {
            transform: rotateY(270deg) translateX(-50%);
            transform-origin: center left;
        }
        
        .spinner div:nth-of-type(4) {
            transform: rotateX(90deg) translateY(-50%);
            transform-origin: top center;
        }
        
        .spinner div:nth-of-type(5) {
            transform: rotateX(-90deg) translateY(50%);
            transform-origin: bottom center;
        }
        
        .spinner div:nth-of-type(6) {
            transform: translateZ(22px);
        }
        
        @keyframes spinner-y0fdc1 {
            0% {
                transform: rotate(45deg) rotateX(-25deg) rotateY(25deg);
            }
            50% {
                transform: rotate(45deg) rotateX(-385deg) rotateY(25deg);
            }
            100% {
                transform: rotate(45deg) rotateX(-385deg) rotateY(385deg);
            }
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 35, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-overlay .loading-text {
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* Inline spinner (smaller) */
        .spinner-sm {
            width: 22px;
            height: 22px;
        }
        
        .spinner-sm > div {
            border-width: 1px;
        }
        
        .spinner-sm div:nth-of-type(1) {
            transform: translateZ(-11px) rotateY(180deg);
        }
        
        .spinner-sm div:nth-of-type(6) {
            transform: translateZ(11px);
        }
        
        /* Button loading state */
        .btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }
        
        .btn.loading .btn-text {
            visibility: hidden;
        }
        
        .btn.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: btn-spinner 0.6s linear infinite;
        }
        
        @keyframes btn-spinner {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        
        .form-group label.required::after {
            content: " *";
            color: var(--danger);
        }
        
        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-control:read-only {
            background: var(--bg-light);
            color: var(--text-muted);
        }
        
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        /* Errors */
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }
        
        /* Lists */
        .model-list {
            list-style: none;
        }
        
        .model-list li {
            margin-bottom: 0.5rem;
        }
        
        .model-list a {
            display: block;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .model-list a:hover {
            background: var(--bg-light);
            border-color: var(--primary);
            text-decoration: none;
        }
        
        /* Actions */
        .actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        /* Debug badge */
        .debug-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: var(--success);
            color: white;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .empty-state p {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-title">
            <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bolt-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#4DA8FF"/>
                        <stop offset="100%" style="stop-color:#1E90FF"/>
                    </linearGradient>
                </defs>
                <polygon points="55,5 25,45 45,45 20,95 75,40 50,40 70,5" fill="url(#bolt-gradient)"/>
            </svg>
            <a href="{{ request.url_for('admin:index') }}">{{ site_name }}</a>
            {% if debug %}<span class="debug-badge">DEBUG</span>{% endif %}
        </div>
        <div class="admin-user">
            {% if user %}
                {{ user.email or user.id }}
            {% endif %}
        </div>
    </header>
    
    {% block breadcrumb %}{% endblock %}
    
    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="loading-text">Loading...</div>
    </div>
    
    <script>
        // Loading overlay helpers
        const loadingOverlay = document.getElementById('loading-overlay');
        
        function showLoading(text = 'Loading...') {
            loadingOverlay.querySelector('.loading-text').textContent = text;
            loadingOverlay.classList.add('active');
        }
        
        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }
        
        // Auto-show loading on form submit
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                const submitBtn = form.querySelector('button[type="submit"]');
                if (submitBtn) {
                    submitBtn.classList.add('loading');
                }
                showLoading('Saving...');
            });
        });
        
        // Show loading on delete actions
        document.querySelectorAll('form[action*="delete"]').forEach(form => {
            form.addEventListener('submit', function(e) {
                showLoading('Deleting...');
            });
        });
    </script>
</body>
</html>
