<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4DA8FF;
            --primary-dark: #1E90FF;
            --danger: #dc3545;
            --success: #28a745;
            --bg: #0f0f23;
            --bg-light: #1a1a2e;
            --bg-card: #16213e;
            --text: #ffffff;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        
        a {
            color: var(--primary);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
        
        /* Header */
        .admin-header {
            background: var(--bg-light);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .admin-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .admin-title a {
            color: var(--text);
        }
        
        .admin-title .logo {
            width: 28px;
            height: 28px;
        }
        
        .admin-user {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        /* Breadcrumb */
        .breadcrumb {
            padding: 1rem 2rem;
            background: var(--bg-light);
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        
        .breadcrumb a {
            color: var(--text-muted);
        }
        
        .breadcrumb a:hover {
            color: var(--primary);
        }
        
        .breadcrumb span {
            margin: 0 0.5rem;
        }
        
        /* Main Content */
        .admin-main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--primary);
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            text-align: left;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--bg-light);
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        
        tr:hover {
            background: rgba(77, 168, 255, 0.05);
        }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(77, 168, 255, 0.3);
            text-decoration: none;
        }
        
        .btn-secondary {
            background: var(--bg-light);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--bg-card);
            text-decoration: none;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
            text-decoration: none;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        
        .form-group label.required::after {
            content: " *";
            color: var(--danger);
        }
        
        .form-control {
            width: 100%;
            padding: 0.625rem 0.875rem;
            font-size: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            transition: border-color 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .form-control:read-only {
            background: var(--bg-light);
            color: var(--text-muted);
        }
        
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        /* Errors */
        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }
        
        /* Lists */
        .model-list {
            list-style: none;
        }
        
        .model-list li {
            margin-bottom: 0.5rem;
        }
        
        .model-list a {
            display: block;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .model-list a:hover {
            background: var(--bg-light);
            border-color: var(--primary);
            text-decoration: none;
        }
        
        /* Actions */
        .actions {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        /* Debug badge */
        .debug-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background: var(--success);
            color: white;
            font-size: 0.75rem;
            border-radius: 4px;
            margin-left: 0.5rem;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .empty-state p {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-title">
            <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bolt-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#4DA8FF"/>
                        <stop offset="100%" style="stop-color:#1E90FF"/>
                    </linearGradient>
                </defs>
                <polygon points="55,5 25,45 45,45 20,95 75,40 50,40 70,5" fill="url(#bolt-gradient)"/>
            </svg>
            <a href="{{ request.url_for('admin:index') }}">{{ site_name }}</a>
            {% if debug %}<span class="debug-badge">DEBUG</span>{% endif %}
        </div>
        <div class="admin-user">
            {% if user %}
                {{ user.email or user.id }}
            {% endif %}
        </div>
    </header>
    
    {% block breadcrumb %}{% endblock %}
    
    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
